# Railway — HTML vitrina + API búsqueda/RAG
# Settings → Build: Builder = Dockerfile (no Railpack)
# Root Directory: vacío (raíz del repo)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh deploy/entrypoint.sh"
healthcheckPath = "/api/motor/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
