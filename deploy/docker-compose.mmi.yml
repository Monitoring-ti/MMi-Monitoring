# MMI API — contenedor aislado de n8n
# Uso: cd /opt/mmi && docker compose -f deploy/docker-compose.mmi.yml up -d --build
# n8n NO está en este compose; no lo modifica.

services:
  mmi-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MMI_DEPLOY_MODE: vitrina
    volumes:
      - ../out:/app/out:ro
    ports:
      - "127.0.0.1:8773:8773"
    # ENTRYPOINT = deploy/entrypoint.sh (mismo que Railway)
